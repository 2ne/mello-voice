name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  guard:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match app version and release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          APP_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag ${TAG} (v${VERSION}) does not match src-tauri/tauri.conf.json (${APP_VERSION})."
            echo "Run npm run release:prepare, commit, then tag v${APP_VERSION}."
            exit 1
          fi
          NOTES="releases/v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing ${NOTES} (user-facing release notes)."
            exit 1
          fi

  build:
    name: Build (${{ matrix.label }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            artifact: macos
          - label: Windows
            os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Prepare Whisper assets
        run: npm run setup:whisper

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload macOS bundles
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v5
        with:
          name: macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

      - name: Upload Windows installers
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Flatten installers for upload
        run: |
          set -euo pipefail
          mkdir -p release-upload
          find release-assets -type f -exec cp -f {} release-upload/ \;
          ls -la release-upload

      - name: Compose release notes (user content)
        run: node scripts/compose-release-body.mjs "${{ github.ref_name }}" > release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mello Voice ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release-body.md
          files: release-upload/*

      - name: Patch download links from uploaded assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/patch-release-download-links.mjs "${{ github.ref_name }}" release-body.md
