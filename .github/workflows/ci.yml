name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Prepare Tauri CI sidecars
        run: |
          triple="$(rustc --print host-tuple)"
          mkdir -p \
            src-tauri/binaries \
            src-tauri/resources/models \
            src-tauri/resources/whisper_runtime

          bin="src-tauri/binaries/whisper-cli-${triple}"
          printf '#!/usr/bin/env sh\nprintf "CI placeholder for %s; not used by tests.\\n" "$0" >&2\nexit 1\n' > "$bin"
          chmod +x "$bin"

          touch src-tauri/resources/models/ggml-base.en-q8_0.bin

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
