            // ==========================================================
            // Mockup helpers, Sonner-style toast stack
            // Per emilkowal.ski/ui/building-a-toast-component
            // ==========================================================
            const TOAST_LIFT = 12 // px offset per stack index (peek amount)
            const TOAST_GAP = 8 // px gap between toasts when expanded
            const TOAST_SCALE_STEP = 0.06 // scale reduction per stack index
            const TOAST_VISIBLE = 3 // stack depth before fading to 0
            const TOAST_LEAVE_MS = 450 // wait before removing from DOM after leave starts

            function ensureToastList(host) {
                let list = host.querySelector(':scope > .mockup-toast-list')
                if (list) return list
                list = document.createElement('ol')
                list.className = 'mockup-toast-list'
                host.appendChild(list)
                return list
            }

            function relayoutToasts(list) {
                // Newest first: DOM order is oldest-first (append order), so reverse.
                const items = [...list.querySelectorAll('.mockup-toast:not([data-removed="true"])')].reverse()
                // Ensure each toast's natural height is cached (measured once, before it starts shrinking).
                items.forEach(item => {
                    if (!item._h) item._h = item.offsetHeight
                })
                const frontHeight = items[0] && items[0]._h ? items[0]._h : 0
                let cumulative = 0
                items.forEach((item, i) => {
                    item.dataset.stackIndex = String(i)
                    item.dataset.front = i === 0 ? 'true' : 'false'
                    item.style.setProperty('--y-stack', `${i * TOAST_LIFT}px`)
                    item.style.setProperty('--s-stack', String(Math.max(0.6, 1 - i * TOAST_SCALE_STEP)))
                    item.style.setProperty('--o-stack', i < TOAST_VISIBLE ? '1' : '0')
                    item.style.setProperty('--h-stack', `${frontHeight}px`)
                    item.style.setProperty('--h-natural', `${item._h}px`)
                    item.style.setProperty('--y-expand', `${cumulative}px`)
                    item.style.zIndex = String(1000 - i)
                    cumulative += item._h + TOAST_GAP
                })
            }

            function showMockupToast(host, text, duration = 1600) {
                if (!host) return
                const list = ensureToastList(host)
                const item = document.createElement('li')
                item.className = 'mockup-toast'
                item.setAttribute('role', 'status')
                item.dataset.mounted = 'false'
                item.innerHTML = `
                    <div class="mockup-toast-body">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
                        <span></span>
                    </div>
                `
                item.querySelector('span').textContent = text
                list.appendChild(item)
                // Measure natural height while data-mounted='false' keeps it visually offscreen.
                // offsetHeight forces layout so the starting styles paint before mount flip.
                item._h = item.offsetHeight
                // Set stack variables on all toasts (older ones shift back on this frame).
                relayoutToasts(list)
                // Next frame: flip data-mounted so the enter transition runs.
                requestAnimationFrame(() => {
                    item.dataset.mounted = 'true'
                })
                // Auto-dismiss: mark removed → shift remaining forward → drop from DOM.
                setTimeout(() => {
                    item.dataset.removed = 'true'
                    requestAnimationFrame(() => relayoutToasts(list))
                    setTimeout(() => {
                        item.remove()
                        if (list.querySelector('.mockup-toast')) relayoutToasts(list)
                    }, TOAST_LEAVE_MS)
                }, duration)
            }

            function downloadBlankPdf(filename) {
                const objects = [
                    '<</Type/Catalog/Pages 2 0 R>>',
                    '<</Type/Pages/Kids[3 0 R]/Count 1>>',
                    '<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<<>>>>',
                ]
                let body = '%PDF-1.4\n'
                const offsets = []
                objects.forEach((obj, i) => {
                    offsets.push(body.length)
                    body += `${i + 1} 0 obj\n${obj}\nendobj\n`
                })
                const xrefStart = body.length
                body += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`
                offsets.forEach(o => {
                    body += `${String(o).padStart(10, '0')} 00000 n \n`
                })
                body += `trailer\n<</Size ${objects.length + 1}/Root 1 0 R>>\nstartxref\n${xrefStart}\n%%EOF\n`
                const blob = new Blob([body], { type: 'application/pdf' })
                const url = URL.createObjectURL(blob)
                const a = document.createElement('a')
                a.href = url
                a.download = filename
                document.body.appendChild(a)
                a.click()
                a.remove()
                setTimeout(() => URL.revokeObjectURL(url), 1000)
            }

            function fireConfetti() {
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
                const canvas = document.createElement('canvas')
                canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999'
                canvas.width = window.innerWidth
                canvas.height = window.innerHeight
                document.body.appendChild(canvas)
                const ctx = canvas.getContext('2d')

                const isDark = document.documentElement.dataset.theme === 'dark'
                const colors = isDark ? ['#aced98', '#6fd850', '#cbf4be', '#4bbe29', '#e5fbdd'] : ['#00b100', '#2ef526', '#068509', '#60fe58', '#9dff95']

                const pieces = Array.from({ length: 55 }, () => {
                    const angle = (-90 + (Math.random() - 0.5) * 130) * (Math.PI / 180)
                    const speed = 4 + Math.random() * 6
                    return {
                        x: canvas.width / 2 + (Math.random() - 0.5) * 120,
                        y: canvas.height * 0.72,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        w: 5 + Math.random() * 5,
                        h: 3 + Math.random() * 4,
                        rot: Math.random() * Math.PI * 2,
                        rotV: (Math.random() - 0.5) * 0.25,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        circle: Math.random() < 0.3,
                        alpha: 1,
                    }
                })

                const gravity = 0.22
                const drag = 0.985
                let frame
                const tick = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height)
                    let alive = false
                    pieces.forEach(p => {
                        p.vy += gravity
                        p.vx *= drag
                        p.vy *= drag
                        p.x += p.vx
                        p.y += p.vy
                        p.rot += p.rotV
                        if (p.y > canvas.height * 0.6) p.alpha -= 0.03
                        p.alpha = Math.max(0, p.alpha)
                        if (p.alpha === 0) return
                        alive = true
                        ctx.save()
                        ctx.globalAlpha = p.alpha
                        ctx.fillStyle = p.color
                        ctx.translate(p.x, p.y)
                        ctx.rotate(p.rot)
                        if (p.circle) {
                            ctx.beginPath()
                            ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2)
                            ctx.fill()
                        } else {
                            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h)
                        }
                        ctx.restore()
                    })
                    if (alive) {
                        frame = requestAnimationFrame(tick)
                    } else {
                        canvas.remove()
                    }
                }
                frame = requestAnimationFrame(tick)
                setTimeout(() => {
                    cancelAnimationFrame(frame)
                    canvas.remove()
                }, 3000)
            }

            function showLockedOverlay(frame, onDismiss) {
                if (frame.querySelector('.mockup-locked-overlay')) return
                const overlay = document.createElement('div')
                overlay.className = 'mockup-locked-overlay'
                overlay.setAttribute('role', 'status')
                overlay.innerHTML = `<div class="mockup-locked-overlay-inner">Answer the question to see the fix</div>`
                overlay.addEventListener('click', () => {
                    overlay.remove()
                    if (onDismiss) onDismiss()
                })
                frame.appendChild(overlay)
            }

            function hideLockedOverlay(frame) {
                const overlay = frame.querySelector('.mockup-locked-overlay')
                if (overlay) overlay.remove()
            }

            // ==========================================================
            // App state
            // ==========================================================
            const content = document.getElementById('content')
            const progressFill = document.getElementById('progress-fill')
            const headerMeta = document.getElementById('header-meta')
            const headerMetaStep = document.getElementById('header-meta-step')
            const headerMetaTitle = document.getElementById('header-meta-title')

            let headObserver = null
            function attachHeadObserver(questionHeadEl, stepText, titleText) {
                detachHeadObserver()
                headerMetaStep.textContent = stepText
                headerMetaTitle.textContent = titleText
                if (!('IntersectionObserver' in window)) return
                headObserver = new IntersectionObserver(
                    ([entry]) => {
                        const visible = !entry.isIntersecting
                        headerMeta.classList.toggle('visible', visible)
                        headerMeta.setAttribute('aria-hidden', String(!visible))
                    },
                    { threshold: 0, rootMargin: '-70px 0px 0px 0px' }
                )
                headObserver.observe(questionHeadEl)
            }
            function detachHeadObserver(instant = false) {
                if (headObserver) headObserver.disconnect()
                headObserver = null
                if (instant) {
                    headerMeta.style.transition = 'none'
                    headerMeta.classList.remove('visible')
                    headerMeta.setAttribute('aria-hidden', 'true')
                    requestAnimationFrame(() => {
                        headerMeta.style.transition = ''
                    })
                } else {
                    headerMeta.classList.remove('visible')
                    headerMeta.setAttribute('aria-hidden', 'true')
                }
            }

            let state = {
                screen: 'intro', // intro | question | results
                index: 0,
                answers: new Array(questions.length).fill(null), // index of chosen option, or null
                checked: new Array(questions.length).fill(false),
                variant: new Array(questions.length).fill('before'), // 'before' | 'after', which mockup variant is displayed
            }

            // ==========================================================
            // Render
            // ==========================================================
            function render() {
                detachHeadObserver(true)
                content.innerHTML = ''
                updateProgress()
                if (state.screen === 'intro') renderIntro()
                else if (state.screen === 'question') renderQuestion()
                else if (state.screen === 'results') renderResults()
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
                try {
                    if (reducedMotion) window.scrollTo(0, 0)
                    else window.scrollTo({ top: 0, behavior: 'smooth' })
                } catch (e) {
                    window.scrollTo(0, 0)
                }
            }

            function updateProgress() {
                if (state.screen === 'intro') {
                    progressFill.style.width = '0%'
                } else if (state.screen === 'question') {
                    progressFill.style.width = `${(state.index / questions.length) * 100}%`
                } else {
                    progressFill.style.width = '100%'
                }
            }

            function renderIntro() {
                const node = document.getElementById('tpl-intro').content.cloneNode(true)
                content.appendChild(node)
                const startBtn = document.getElementById('start-btn')
                startBtn.addEventListener('click', startQuiz)
                startBtn.focus()
            }

            function startQuiz() {
                state.screen = 'question'
                state.index = 0
                state.answers = new Array(questions.length).fill(null)
                state.checked = new Array(questions.length).fill(false)
                state.variant = new Array(questions.length).fill('before')
                render()
            }

            function renderQuestion() {
                const q = questions[state.index]
                const correctIndex = q.options.findIndex(o => o.correct)
                const node = document.getElementById('tpl-question').content.cloneNode(true)
                const section = node.querySelector('section')

                section.querySelector('[data-bind="step"]').textContent = `Question ${state.index + 1} of ${questions.length}`
                section.querySelector('[data-bind="title"]').textContent = q.title
                const mockupFrame = section.querySelector('.mockup-frame')
                const mockupHost = section.querySelector('[data-bind="mockup"]')
                const mockupLabel = section.querySelector('.mockup-label')
                const mockupSwitch = section.querySelector('[data-bind="switch"]')
                const hasCorrected = typeof q.mockupCorrect === 'function'
                if (!state.checked[state.index] && state.variant[state.index] === 'after') state.variant[state.index] = 'before'

                function paintMockup(variant) {
                    const useCorrected = variant === 'after' && hasCorrected && state.checked[state.index]
                    mockupHost.innerHTML = useCorrected ? q.mockupCorrect() : q.mockup()
                    if (q.wire) q.wire(mockupHost, { corrected: useCorrected })
                }

                function updateSwitch() {
                    if (!hasCorrected) {
                        mockupSwitch.hidden = true
                        mockupFrame.removeAttribute('data-has-switch')
                        return
                    }
                    mockupSwitch.hidden = false
                    mockupFrame.setAttribute('data-has-switch', '')
                    const variant = state.variant[state.index]
                    mockupSwitch.setAttribute('data-variant', variant)
                    const beforeBtn = mockupSwitch.querySelector('[data-variant="before"]')
                    const afterBtn = mockupSwitch.querySelector('[data-variant="after"]')
                    beforeBtn.setAttribute('aria-pressed', variant === 'before' ? 'true' : 'false')
                    afterBtn.setAttribute('aria-pressed', variant === 'after' ? 'true' : 'false')
                }

                mockupSwitch.querySelectorAll('button[data-variant]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const v = btn.dataset.variant
                        if (v === 'after' && !state.checked[state.index]) {
                            mockupSwitch.setAttribute('data-variant', 'after')
                            mockupSwitch.querySelector('[data-variant="before"]').setAttribute('aria-pressed', 'false')
                            mockupSwitch.querySelector('[data-variant="after"]').setAttribute('aria-pressed', 'true')
                            showLockedOverlay(mockupFrame, () => updateSwitch())
                            return
                        }
                        const wasLocked = !!mockupFrame.querySelector('.mockup-locked-overlay')
                        hideLockedOverlay(mockupFrame)
                        if (!wasLocked && state.variant[state.index] === v) return
                        state.variant[state.index] = v
                        updateSwitch()
                        paintMockup(v)
                    })
                })

                updateSwitch()
                paintMockup(state.variant[state.index])
                section.querySelector('[data-bind="prompt"]').textContent = q.prompt

                const form = section.querySelector('[data-bind="form"]')
                const optionsEl = section.querySelector('[data-bind="options"]')
                const revealEl = section.querySelector('[data-bind="reveal"]')
                const revealHead = section.querySelector('[data-bind="reveal-head"]')
                const revealBody = section.querySelector('[data-bind="reveal-body"]')
                const revealPrinciple = section.querySelector('[data-bind="reveal-principle"]')
                const answerError = section.querySelector('[data-bind="answer-error"]')
                const checkBtn = section.querySelector('[data-bind="check-btn"]')
                const nextBtn = section.querySelector('[data-bind="next-btn"]')
                const backBtn = section.querySelector('[data-bind="back-btn"]')

                optionsEl.setAttribute('tabindex', '-1')
                const legend = document.createElement('legend')
                legend.textContent = 'Choose one response'
                optionsEl.appendChild(legend)

                q.options.forEach((opt, i) => {
                    const id = `q${state.index}-opt${i}`
                    const label = document.createElement('label')
                    label.className = 'option'
                    label.setAttribute('for', id)
                    label.innerHTML = `
                        <input type="radio" name="q-${state.index}" id="${id}" value="${i}" />
                        <span class="option-text"></span>
                    `
                    label.querySelector('.option-text').textContent = opt.text
                    optionsEl.appendChild(label)

                    const radio = label.querySelector('input')
                    if (state.answers[state.index] === i) radio.checked = true
                    radio.addEventListener('change', () => {
                        if (state.checked[state.index]) return
                        state.answers[state.index] = i
                        answerError.hidden = true
                    })
                })

                if (state.index === 0) backBtn.style.visibility = 'hidden'

                backBtn.addEventListener('click', () => {
                    if (state.index === 0) {
                        state.screen = 'intro'
                    } else {
                        state.index -= 1
                    }
                    render()
                })

                if (state.checked[state.index]) {
                    showReveal(false)
                }

                form.addEventListener('submit', e => {
                    e.preventDefault()
                    if (state.checked[state.index]) return
                    if (state.answers[state.index] === null) {
                        answerError.hidden = false
                        optionsEl.focus()
                        return
                    }
                    answerError.hidden = true
                    state.checked[state.index] = true
                    hideLockedOverlay(mockupFrame)
                    if (hasCorrected) {
                        state.variant[state.index] = 'after'
                        paintMockup('after')
                    }
                    updateSwitch()
                    showReveal(true)
                })

                nextBtn.addEventListener('click', () => {
                    if (state.index === questions.length - 1) {
                        state.screen = 'results'
                    } else {
                        state.index += 1
                    }
                    render()
                })

                content.appendChild(node)

                attachHeadObserver(content.querySelector('.question-head'), `Question ${state.index + 1} of ${questions.length}`, q.title)

                function showReveal(celebrate = false) {
                    const chosen = state.answers[state.index]
                    const correct = chosen === correctIndex
                    if (correct && celebrate) fireConfetti()
                    revealHead.classList.add(correct ? 'correct' : 'incorrect')
                    revealHead.innerHTML = correct
                        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg><span>Correct</span>`
                        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg><span>Incorrect</span>`

                    const chosenExplain = q.options[chosen].explain
                    const correctExplain = q.options[correctIndex].explain
                    revealBody.innerHTML = correct
                        ? `<strong>${q.options[correctIndex].text}</strong> ${correctExplain}`
                        : `${chosenExplain}<br><br><strong>${q.options[correctIndex].text}</strong> ${correctExplain}`
                    revealPrinciple.textContent = q.principle

                    revealEl.classList.add('visible')

                    optionsEl.querySelectorAll('.option').forEach((labelEl, i) => {
                        labelEl.setAttribute('data-locked', 'true')
                        labelEl.querySelector('input').disabled = true
                        if (i === correctIndex) labelEl.setAttribute('data-state', chosen === correctIndex ? 'correct' : 'reveal-correct')
                        else if (i === chosen) labelEl.setAttribute('data-state', 'incorrect')
                        else labelEl.setAttribute('data-state', 'muted')
                    })

                    checkBtn.style.display = 'none'
                    const chevronRight = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>`
                    nextBtn.style.display = ''
                    nextBtn.innerHTML = state.index === questions.length - 1 ? `See results ${chevronRight}` : `Next question ${chevronRight}`
                    nextBtn.focus()
                }
            }

            function renderResults() {
                const node = document.getElementById('tpl-results').content.cloneNode(true)
                const section = node.querySelector('section')
                const score = state.answers.reduce((acc, ans, i) => acc + (ans === questions[i].options.findIndex(o => o.correct) ? 1 : 0), 0)

                section.querySelector('[data-bind="score"]').textContent = String(score)
                section.querySelector('[data-bind="total"]').textContent = String(questions.length)

                const ratio = score / questions.length
                let headline, subhead
                if (ratio === 1) {
                    headline = 'UX master.'
                    subhead = 'The more interesting question: which of these patterns have you seen ship in one of our tools?'
                } else if (ratio >= 0.75) {
                    headline = 'Nice work.'
                    subhead = 'The missed patterns are the useful part. They are usually the ones that quietly make it into production.'
                } else if (ratio >= 0.5) {
                    headline = 'Good start.'
                    subhead = 'A few of these turn on a subtle distinction. The takeaways below list the rule behind each question.'
                } else {
                    headline = 'Worth a second pass.'
                    subhead = "Read the takeaways below, then try again. You'll catch most of these the second time through."
                }
                section.querySelector('[data-bind="headline"]').textContent = headline
                section.querySelector('[data-bind="subhead"]').textContent = subhead

                const grid = section.querySelector('[data-bind="grid"]')
                questions.forEach((q, i) => {
                    const correctIndex = q.options.findIndex(o => o.correct)
                    const correct = state.answers[i] === correctIndex
                    const row = document.createElement('div')
                    row.className = 'result-row'
                    row.innerHTML = `
                        <span class="step tabular">${String(i + 1).padStart(2, '0')}</span>
                        <div class="topic">
                            <div></div>
                            <div class="principle"></div>
                        </div>
                        <span class="mark ${correct ? 'correct' : 'incorrect'}" aria-label="${correct ? 'Correct' : 'Incorrect'}">${correct ? '✓' : '✕'}</span>
                    `
                    row.querySelector('.topic > div').textContent = q.topic
                    row.querySelector('.principle').textContent = q.title
                    grid.appendChild(row)
                })

                content.appendChild(node)

                document.getElementById('restart-btn').addEventListener('click', startQuiz)
            }

            // ==========================================================
            // Boot
            // ==========================================================
            document.addEventListener('keydown', e => {
                if (e.key !== 'Enter') return
                const t = e.target
                if (t instanceof HTMLButtonElement || t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement || t instanceof HTMLSelectElement)
                    return
                if (state.screen === 'intro') {
                    e.preventDefault()
                    startQuiz()
                } else if (state.screen === 'results') {
                    e.preventDefault()
                    startQuiz()
                }
            })

            // ==========================================================
            // Theme toggle (Ctrl+Alt+D and header button)
            // Initial theme is set in <head> before paint.
            // ==========================================================
            const themeToggle = document.getElementById('theme-toggle')
            function setTheme(next) {
                document.documentElement.classList.add('no-transition')
                document.documentElement.dataset.theme = next
                requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('no-transition')))
                try {
                    localStorage.setItem('ux-quest-theme', next)
                } catch (e) {}
                if (themeToggle) themeToggle.setAttribute('aria-label', next === 'dark' ? 'Switch to light mode' : 'Switch to dark mode')
            }
            function toggleTheme() {
                setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')
            }
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme)
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && e.altKey && (e.key === 'd' || e.key === 'D')) {
                    e.preventDefault()
                    toggleTheme()
                }
            })
            // Follow system pref changes only when the user hasn't chosen explicitly.
            try {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (!localStorage.getItem('ux-quest-theme')) {
                        document.documentElement.dataset.theme = e.matches ? 'dark' : 'light'
                    }
                })
            } catch (e) {}
            // Sync the toggle's accessible label to the current state on first render.
            if (themeToggle)
                themeToggle.setAttribute('aria-label', document.documentElement.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode')

            render()
        </script>
    </body>
</html>
