        <script>
            // Set theme before first paint to avoid flash.
            ;(function () {
                try {
                    const stored = localStorage.getItem('ux-quest-theme')
                    const theme =
                        stored === 'light' || stored === 'dark' ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                    document.documentElement.dataset.theme = theme
                } catch (e) {
                    document.documentElement.dataset.theme = 'light'
                }
            })()
        </script>
        <style>
            /* ==========================================================
               Design tokens, mirrored from @cgsh-gaia/design-library
               ========================================================== */
            :root {
                color-scheme: light;
                /* Primary scale, canonical @cgsh-gaia/design-library values (light mode) */
                --color-primary: #00b100;
                --color-primary-50: #e9ffe5;
                --color-primary-100: #ccffc7;
                --color-primary-200: #9dff95;
                --color-primary-300: #60fe58;
                --color-primary-400: #2ef526;
                --color-primary-500: #09dc06;
                --color-primary-600: #00b100;
                --color-primary-700: #068509;
                --color-primary-800: #0b690d;
                --color-primary-900: #0f5813;
                --color-primary-950: #013205;
                /* Foreground color to use on top of a primary-filled surface */
                --color-on-primary: #ffffff;

                --color-background: #fafafa;
                --color-surface-100: #ffffff;
                --color-surface-200: #f4f4f5;
                --color-surface-300: #e4e4e7;
                --color-surface-400: #d4d4d8;
                --color-surface-interactive: #ffffff;

                --color-title: #18181b;
                --color-body: #27272a;
                --color-subtitle: #52525b;
                --color-muted: #71717a;

                --color-border: #d4d4d8;
                --color-border-light: #e4e4e7;
                --color-border-dark: #a1a1aa;

                --color-error: #d32f2f;
                --color-error-light: #ef5350;
                --color-error-bg: #fdecea;

                --color-success: #008a00;
                --color-success-bg: color-mix(in srgb, var(--color-primary) 10%, transparent);

                --color-contained-bg: #18181b;
                --color-contained-fg: #fafafa;

                /*
                 * Sunken well surface, used where an inset/recessed area is desired
                 * (like the mockup device chrome around a mini-app). In LIGHT mode it's
                 * one shade darker than the background (surface-200). In DARK mode it
                 * matches the background exactly, because you can't visually recess
                 * below the darkest surface. The well is then defined by its border
                 * and the content inside sits at surface-100+ which appears elevated.
                 */
                --color-well: var(--color-surface-200);
                /* Toggle knob, physical-switch metaphor, always light regardless of theme. */
                --color-toggle-knob: #ffffff;

                /*
                 * Mockup nested-elevation tokens.
                 * The mockup frame sits on the body; the app card sits inside the frame.
                 * The card must always read as MORE elevated than the frame regardless
                 * of theme, which requires flipping the surface assignments:
                 *   LIGHT: frame = light gray (surface-200), card = white (surface-100)
                 *   DARK:  frame = darker (surface-100), card = lighter (surface-200)
                 * Menu panels (dropdowns inside the card) follow the same pattern.
                 */
                --color-mockup-frame: var(--color-surface-200);
                --color-mockup-card: var(--color-surface-100);
                --color-menu-panel: var(--color-surface-100);
                --color-menu-hover: var(--color-surface-200);

                --shadow-sm: 0 1px 2px 0 rgb(24 24 27 / 0.04);
                --shadow-md: 0 4px 12px -2px rgb(228 228 231 / 0.25), 0 2px 4px -2px rgb(228 228 231 / 0.25);

                --ring-surface-300: inset 0 0 0 1px var(--color-surface-300);
                --ring-border: inset 0 0 0 1px var(--color-border);
                --ring-primary: 0 0 0 2px var(--color-primary);

                --radius-sm: 4px;
                --radius-md: 8px;
                --radius-lg: 8px;
                --radius-xl: 12px;

                --ease: cubic-bezier(0.4, 0, 0.2, 1);

                --font-sans: 'Funnel Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                --font-display: 'Lyon Display Web', Georgia, 'Times New Roman', serif;
            }

            :root[data-theme='dark'] {
                color-scheme: dark;
                /* Primary scale, canonical @cgsh-gaia/design-library values (dark mode).
                   In dark mode --color-primary resolves to primary-300 (#aced98), a pale
                   green tuned for text/link contrast on dark surfaces. When used as a
                   filled surface (toggle-on, buttons), pair with --color-on-primary
                   (primary-950) for the foreground so contrast is preserved. */
                --color-primary: #aced98;
                --color-primary-50: #f5fcf1;
                --color-primary-100: #e5fbdd;
                --color-primary-200: #cbf4be;
                --color-primary-300: #aced98;
                --color-primary-400: #6fd850;
                --color-primary-500: #4bbe29;
                --color-primary-600: #399d1c;
                --color-primary-700: #2f7c19;
                --color-primary-800: #296219;
                --color-primary-900: #225017;
                --color-primary-950: #0e2c07;
                --color-on-primary: #0e2c07;

                /*
                 * Surface scale, tuned for this app.
                 * Each step is a subtle rise from body; higher number = more elevated = LIGHTER.
                 * background → surface-100 → surface-200 → surface-300 → surface-400
                 * = #09090b → #101013 → #18181b → #27272a → #3f3f46
                 */
                --color-background: #09090b;
                --color-surface-100: #101013;
                --color-surface-200: #18181b;
                --color-surface-300: #27272a;
                --color-surface-400: #3f3f46;
                --color-surface-interactive: #18181b;

                --color-title: #fafafa;
                --color-body: #e4e4e7;
                --color-subtitle: #a1a1aa;
                --color-muted: #71717a;

                /* Dark mode leans on surface contrast, not borders.
                   border-light is a subtle divider color \u2014 visible on cards (surface-200)
                   without competing with the fuller --color-border. */
                --color-border: #27272a;
                --color-border-light: #1f1f22;
                --color-border-dark: #3f3f46;

                --color-error: #f87171;
                --color-error-light: #fca5a5;
                --color-error-bg: rgb(239 68 68 / 0.14);

                --color-success: #4ade80;
                --color-success-bg: color-mix(in srgb, var(--color-primary) 10%, transparent);

                --color-contained-bg: #fafafa;
                --color-contained-fg: #18181b;

                /* In dark mode, the well collapses to background, border defines the frame. */
                --color-well: var(--color-background);

                /* Mockup nested-elevation tokens (dark). See light-mode block for rationale. */
                --color-mockup-frame: var(--color-surface-100);
                --color-mockup-card: var(--color-surface-200);
                --color-menu-panel: var(--color-surface-300);
                --color-menu-hover: var(--color-surface-400);

                --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.35);
                --shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.5);
            }

            /* Dark mode: swap form controls from transparent+border to filled+no-border.
               Surface contrast handles definition; light mode keeps its borders. */
            :root[data-theme='dark'] .ui-input,
            :root[data-theme='dark'] .ui-btn.outlined {
                background: var(--color-surface-300);
                border-color: transparent;
            }
            :root[data-theme='dark'] .ui-select {
                border-color: transparent;
            }
            /* Options: hide the default border in dark; state borders (hover, checked,
               correct, incorrect) still render because they override border-color. */
            :root[data-theme='dark'] .option:not([data-state]) {
                background: var(--color-surface-200);
            }
            :root[data-theme='dark'] .option[data-state='reveal-correct'] {
                background: color-mix(in srgb, var(--color-success-bg) 100%, transparent);
            }
            :root[data-theme='dark'] .option input {
                background-color: var(--color-background);
            }

            /* ==========================================================
               Base
               ========================================================== */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                background: var(--color-background);
                color: var(--color-body);
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.5;
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
                min-height: 100dvh;
            }

            ::selection {
                background: rgb(212 212 216 / 0.5);
                color: var(--color-title);
            }

            *::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            *::-webkit-scrollbar-thumb {
                background: color-mix(in srgb, var(--color-title) 15%, transparent);
                border-radius: 999px;
            }
            *::-webkit-scrollbar-thumb:hover {
                background: color-mix(in srgb, var(--color-title) 30%, transparent);
            }

            :focus-visible {
                outline: 2px solid var(--color-primary);
                border-color: transparent !important;
            }

            /* ==========================================================
               Layout
               ========================================================== */
            .app {
                display: flex;
                flex-direction: column;
                min-height: 100dvh;
            }

            .header-wrap {
                position: sticky;
                top: 0;
                z-index: 40;
                background: var(--color-surface-100);
            }

            .header {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 12px 24px;
                background: var(--color-surface-100);
                border-bottom: 1px solid var(--color-border-light);
            }

            .header-brand {
                display: flex;
                align-items: center;
                gap: 12px;
                color: var(--color-title);
            }

            .header-brand svg {
                color: var(--color-title);
            }

            .header-brand .title {
                font-weight: 500;
                color: var(--color-title);
                font-size: 14px;
            }

            .header-actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .header-meta {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                opacity: 0;
                translate: 0 6px;
                transition:
                    opacity 200ms var(--ease),
                    translate 200ms var(--ease);
                pointer-events: none;
            }
            .header-meta.visible {
                opacity: 1;
                translate: 0 0;
            }
            .header-meta-step {
                font-size: 12px;
                font-weight: 500;
                color: var(--color-muted);
                line-height: 1;
            }
            .header-meta-title {
                font-size: 13px;
                font-weight: 500;
                color: var(--color-title);
                line-height: 1.2;
                white-space: nowrap;
            }

            .theme-toggle {
                width: 32px;
                height: 32px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                position: relative;
                background: transparent;
                color: var(--color-subtitle);
                border: 0;
                border-radius: var(--radius-lg);
                cursor: pointer;
                transition:
                    background 160ms var(--ease),
                    color 160ms var(--ease);
            }
            .theme-toggle:hover {
                background: var(--color-surface-200);
                color: var(--color-title);
            }
            .theme-toggle .icon-sun,
            .theme-toggle .icon-moon {
                position: absolute;
                transition:
                    opacity 240ms var(--ease),
                    transform 240ms var(--ease);
            }
            .theme-toggle .icon-sun {
                opacity: 0;
                transform: rotate(-30deg) scale(0.8);
            }
            .theme-toggle .icon-moon {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            :root[data-theme='dark'] .theme-toggle .icon-sun {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            :root[data-theme='dark'] .theme-toggle .icon-moon {
                opacity: 0;
                transform: rotate(30deg) scale(0.8);
            }
            .no-transition .theme-toggle .icon-sun,
            .no-transition .theme-toggle .icon-moon {
                transition:
                    opacity 240ms var(--ease),
                    transform 240ms var(--ease) !important;
            }

            .progress-track {
                position: relative;
                height: 2px;
                background: var(--color-surface-300);
                overflow: hidden;
            }
            .progress-fill {
                position: absolute;
                inset: 0 auto 0 0;
                width: 0%;
                background: var(--color-primary);
                transition: width 240ms var(--ease);
            }

            main.content {
                flex: 1;
                width: 100%;
                max-width: 720px;
                margin: 0 auto;
                padding: 32px 24px 64px;
            }

            @media (max-width: 640px) {
                .header {
                    padding: 10px 16px;
                }
                main.content {
                    padding: 20px 16px 48px;
                }
                .question-actions {
                    align-items: center;
                    flex-direction: row;
                }
                .question-actions > div {
                    justify-content: flex-end;
                    flex-wrap: wrap;
                }
            }

            /* ==========================================================
               Typography
               ========================================================== */
            h1 {
                font-family: var(--font-display);
                font-weight: 400;
                font-size: clamp(28px, 4vw, 36px);
                line-height: 1.15;
                color: var(--color-title);
                margin: 0 0 8px;
                text-wrap: balance;
            }

            h2 {
                font-weight: 500;
                font-size: 20px;
                line-height: 1.3;
                color: var(--color-title);
                margin: 0 0 4px;
                text-wrap: balance;
            }

            h3 {
                font-weight: 500;
                font-size: 14px;
                line-height: 1.4;
                color: var(--color-title);
                margin: 0;
            }

            p {
                margin: 0;
                text-wrap: pretty;
            }

            .text-subtitle {
                color: var(--color-subtitle);
            }
            .text-muted {
                color: var(--color-muted);
            }
            .text-title {
                color: var(--color-title);
            }
            .text-error {
                color: var(--color-error);
            }
            .text-success {
                color: var(--color-success);
            }
            .text-sm {
                font-size: 13px;
            }
            .text-xs {
                font-size: 12px;
            }
            .text-base {
                font-size: 14px;
            }
            .tabular {
                font-variant-numeric: tabular-nums;
            }

            /* ==========================================================
               Buttons
               ========================================================== */
            .btn {
                appearance: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 36px;
                padding: 0 14px;
                border-radius: var(--radius-lg);
                font-family: inherit;
                font-size: 14px;
                font-weight: 500;
                line-height: 1;
                cursor: pointer;
                text-decoration: none;
                user-select: none;
                border: 1px solid transparent;
                background: transparent;
                color: var(--color-body);
                transition:
                    background-color 120ms var(--ease),
                    color 120ms var(--ease),
                    border-color 120ms var(--ease),
                    transform 80ms var(--ease);
            }

            .btn:active {
                transform: scale(0.985);
            }

            .btn > svg:first-child {
                margin-left: -4px;
            }
            .btn > svg:last-child {
                margin-right: -4px;
            }

            .btn:disabled,
            .btn[aria-disabled='true'] {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .btn-contained {
                background: var(--color-contained-bg);
                color: var(--color-contained-fg);
            }
            .btn-contained:hover:not(:disabled) {
                background: color-mix(in srgb, var(--color-contained-bg) 88%, transparent);
            }

            .btn-outlined {
                background: var(--color-surface-interactive);
                color: var(--color-title);
                border-color: var(--color-border);
            }
            .btn-outlined:hover:not(:disabled) {
                border-color: var(--color-border-dark);
            }

            .btn-text {
                background: transparent;
                color: var(--color-title);
                padding: 0 8px;
            }
            .btn-text:hover:not(:disabled) {
                background: var(--color-surface-200);
            }

            .btn-lg {
                height: 40px;
                padding: 0 18px;
                font-size: 16px;
            }

            .btn-icon {
                width: 36px;
                padding: 0;
            }

            /* ==========================================================
               Card
               ========================================================== */
            .card {
                background: var(--color-surface-100);
                border-radius: var(--radius-lg);
                box-shadow: var(--ring-surface-300), var(--shadow-md);
            }

            .card-padded {
                padding: 24px;
            }

            /* ==========================================================
               Screen transitions
               ========================================================== */
            .screen {
                display: none;
                animation: fade-in 180ms var(--ease) both;
            }
            .screen.active {
                display: block;
            }

            @keyframes fade-in {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes modal-in {
                from {
                    opacity: 0;
                    transform: scale(0.94) translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }
            .modal-animate {
                animation: modal-in 180ms var(--ease) both;
            }

            .no-transition *,
            .no-transition *::before,
            .no-transition *::after {
                transition-duration: 0s !important;
                animation-duration: 0s !important;
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    transition-duration: 0.01ms !important;
                }
            }

            /* ==========================================================
               Intro screen
               ========================================================== */
            .screen.intro {
                display: flex;
                flex-direction: column;
                gap: 32px;
                padding-top: 16px;
            }

            .intro-head {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .intro-head h1 {
                margin: 0;
            }

            .intro-eyebrow {
                font-size: 13px;
                font-weight: 500;
                color: var(--color-subtitle);
            }

            .intro-lead {
                font-size: 16px;
                line-height: 1.55;
                color: var(--color-body);
                max-width: 60ch;
                text-wrap: balance;
                margin-top: 4px;
            }

            .intro-meta {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                color: var(--color-subtitle);
                font-size: 13px;
            }

            .intro-meta .dot {
                color: var(--color-border-dark);
            }

            .intro-actions {
                display: flex;
                gap: 12px;
                align-items: center;
            }

            .intro-list {
                margin: 0;
                padding: 0;
                list-style: none;
                display: grid;
                gap: 14px;
            }

            .intro-list li {
                display: grid;
                grid-template-columns: 24px 1fr;
                gap: 8px;
                align-items: start;
            }

            .intro-list .num {
                font-variant-numeric: tabular-nums;
                color: var(--color-muted);
                font-size: 12px;
                font-weight: 500;
                margin-top: 2px;
            }

            .intro-list .label {
                color: var(--color-subtitle);
                font-size: 14px;
            }

            .intro-list .label strong {
                color: var(--color-title);
                font-weight: 500;
            }

            /* ==========================================================
               Question screen
               ========================================================== */
            .question-head {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 20px;
            }

            .question-step {
                font-size: 13px;
                font-weight: 500;
                color: var(--color-muted);
            }

            .question-prompt {
                font-size: 18px;
                line-height: 1.35;
                color: var(--color-title);
                font-weight: 500;
                margin: 0 0 8px;
                text-wrap: balance;
            }

            .mockup-frame {
                background: var(--color-mockup-frame);
                border-radius: 11px;
                box-shadow: inset 0 0 0 1px var(--color-border-light);
                padding-top: 8px;
                margin-bottom: 32px;
                position: relative;
            }

            .mockup-label {
                display: none;
            }

            .mockup-content {
                margin-top: 34px;
            }

            /* Option list */
            .options {
                display: grid;
                gap: 8px;
                margin: 0;
                padding: 0;
                border: 0;
            }

            .options legend {
                padding: 0;
                margin-bottom: 8px;
                font-size: 13px;
                color: var(--color-subtitle);
                font-weight: 500;
            }

            .option {
                display: grid;
                grid-template-columns: 20px 1fr;
                align-items: start;
                gap: 12px;
                padding: 12px 14px;
                background: var(--color-surface-100);
                border: 1px solid var(--color-border-light);
                border-radius: var(--radius-lg);
                cursor: pointer;
                transition:
                    border-color 120ms var(--ease),
                    background-color 120ms var(--ease);
            }
            .option[data-state='correct'] {
                border-color: var(--color-primary);
                background: var(--color-success-bg);
            }
            .option[data-state='incorrect'] {
                border-color: var(--color-error);
                background: var(--color-error-bg);
            }
            .option[data-state='reveal-correct'] {
                border-color: var(--color-primary);
                background: color-mix(in srgb, var(--color-success-bg) 60%, transparent);
            }
            .option[data-state='muted'] {
                opacity: 0.5;
            }
            .option[data-locked] {
                cursor: default;
            }

            .option input {
                appearance: none;
                -webkit-appearance: none;
                -moz-appearance: none;
                margin: 0;
                margin-top: 1px;
                width: 18px;
                height: 18px;
                min-width: 18px;
                flex-shrink: 0;
                display: inline-block;
                border: 1px solid var(--color-border);
                border-radius: 50%;
                background: var(--color-surface-interactive) no-repeat center;
                background-size: 10px 10px;
                cursor: pointer;
                transition:
                    border-color 120ms var(--ease),
                    background-color 120ms var(--ease);
            }
            .option:not([data-locked]) input:checked {
                border-color: var(--color-primary);
                background-image: radial-gradient(circle, var(--color-primary) 0 4px, transparent 5px);
            }
            .option:hover:not([data-locked]) input:not(:checked) {
                border-color: var(--color-primary);
            }
            .option[data-state='correct'] input,
            .option[data-state='reveal-correct'] input {
                border-color: var(--color-primary);
                background-image: radial-gradient(circle, var(--color-primary) 0 4px, transparent 5px);
            }
            .option[data-state='incorrect'] input {
                border-color: var(--color-error);
                background-image: radial-gradient(circle, var(--color-error) 0 4px, transparent 5px);
            }

            .option-text {
                font-size: 14px;
                color: var(--color-body);
                line-height: 1.45;
            }

            /* Reveal panel */
            .reveal {
                margin-top: 16px;
                padding: 16px;
                background: var(--color-surface-200);
                border-radius: var(--radius-lg);
                box-shadow: inset 0 0 0 1px var(--color-border-light);
                display: none;
                flex-direction: column;
                gap: 8px;
                animation: fade-in 180ms var(--ease) both;
            }
            .reveal.visible {
                display: flex;
            }

            .reveal-head {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 500;
                font-size: 14px;
            }

            .reveal-head svg {
                flex-shrink: 0;
            }

            .reveal-head.correct {
                color: var(--color-primary);
            }
            .reveal-head.incorrect {
                color: var(--color-error);
            }

            .reveal-body {
                color: var(--color-body);
                font-size: 14px;
                line-height: 1.55;
            }

            .reveal-body strong {
                color: var(--color-title);
                font-weight: 500;
            }

            .reveal-principle {
                margin-top: 4px;
                padding-top: 10px;
                border-top: 1px solid var(--color-border-light);
                display: flex;
                gap: 8px;
                align-items: baseline;
                font-size: 14px;
                color: var(--color-subtitle);
            }

            .reveal-principle .label {
                color: var(--color-muted);
                font-weight: 500;
                font-size: 14px;
                flex-shrink: 0;
            }

            .answer-error {
                margin-top: 8px;
                font-size: 13px;
                color: var(--color-error);
            }

            .question-actions {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                margin-top: 20px;
            }

            /* ==========================================================
               Mockup primitives
               These mimic the real component styles so each scenario
               looks like a small slice of a real Cleary tool.
               ========================================================== */
            /* Inner mini-app card sits ONE step above the mockup-frame
               (frame is level 1 / surface-100, this is level 2 / surface-200).
               In dark mode that's #18181b frame with #27272a card, card reads
               as elevated. In light mode it's gray frame with white card ,
               the card sits inside the frame like an elevated content surface. */
            .ui-card {
                background: var(--color-mockup-card);
                border-radius: var(--radius-lg);
                box-shadow: inset 0 0 0 1px var(--color-border-light);
                padding: 16px;
            }

            .ui-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 10px 0;
            }
            .ui-row + .ui-row {
                border-top: 1px solid var(--color-border-light);
            }
            .ui-row-label {
                color: var(--color-title);
                font-size: 14px;
                font-weight: 500;
            }
            .ui-row-sub {
                color: var(--color-subtitle);
                font-size: 12px;
                margin-top: 2px;
            }

            .ui-toggle {
                display: inline-block;
                width: 32px;
                height: 18px;
                background: var(--color-surface-400);
                border-radius: 999px;
                position: relative;
                flex-shrink: 0;
                padding: 0;
                border: 0;
                transition: background-color 140ms var(--ease);
            }
            .ui-toggle::after {
                content: '';
                position: absolute;
                top: 2px;
                left: 2px;
                width: 14px;
                height: 14px;
                background: var(--color-toggle-knob);
                border-radius: 999px;
                box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
                transition: left 140ms var(--ease);
            }
            .ui-toggle.on {
                background: var(--color-primary);
            }
            .ui-toggle.on::after {
                left: 16px;
                background: var(--color-surface-200);
            }
            button.ui-toggle {
                cursor: pointer;
                font: inherit;
                color: inherit;
            }
            button.ui-toggle:focus-visible {
                outline: 2px solid var(--color-primary);
                outline-offset: 2px;
            }

            .ui-hint {
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid var(--color-border-light);
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: var(--color-subtitle);
            }
            .ui-hint svg {
                color: var(--color-success);
                flex-shrink: 0;
            }

            .mockup-switch {
                position: absolute;
                top: 8px;
                left: 50%;
                transform: translateX(-50%);
                display: inline-flex;
                align-items: center;
                padding: 3px 3px 3.5px;
                background: var(--color-menu-panel);
                border-radius: 999px;
                box-shadow: inset 0 0 0 1px var(--color-border-light);
                font-family: inherit;
            }
            .mockup-switch::before {
                content: '';
                position: absolute;
                top: 3px;
                bottom: 3px;
                left: 3px;
                width: calc(50% - 3px);
                background: var(--color-surface-200);
                border-radius: 999px;
                box-shadow:
                    var(--shadow-sm),
                    inset 0 0 0 1px var(--color-border-light);
                transition: transform 240ms var(--ease);
            }
            :root[data-theme='dark'] .mockup-switch::before {
                background: var(--color-surface-400);
                box-shadow: var(--shadow-sm);
            }
            .mockup-switch[data-variant='after']::before {
                transform: translateX(100%);
            }
            .mockup-switch button {
                position: relative;
                background: transparent;
                border: 0;
                padding: 4px 14px;
                font-family: inherit;
                font-size: 12px;
                font-weight: 500;
                color: var(--color-subtitle);
                border-radius: 999px;
                cursor: pointer;
                transition: color 200ms var(--ease);
                min-width: 62px;
                line-height: 1;
            }
            .mockup-switch button:disabled {
                cursor: not-allowed;
                color: var(--color-muted);
                opacity: 0.55;
            }
            .mockup-switch button[aria-pressed='true']:not(:disabled) {
                color: var(--color-title);
            }
            .mockup-switch button:focus-visible {
                outline: 2px solid var(--color-primary);
                outline-offset: 2px;
            }

            .ui-input {
                display: block;
                width: 100%;
                background: transparent;
                color: var(--color-title);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-lg);
                padding: 8px 10px;
                font: inherit;
                font-size: 14px;
            }
            .ui-input[aria-invalid='true'] {
                border-color: var(--color-error);
            }
            .ui-input[aria-invalid='true']:focus-visible {
                outline-color: var(--color-error);
            }

            .ui-label {
                display: block;
                color: var(--color-title);
                font-size: 13px;
                font-weight: 500;
                margin-bottom: 4px;
            }

            .ui-field {
                margin-bottom: 10px;
            }

            .ui-btn {
                display: inline-flex;
                align-items: center;
                cursor: pointer;
                min-width: 70px;
                text-align: center;
                justify-content: center;
                gap: 6px;
                padding: 6px 12px;
                background: var(--color-contained-bg);
                color: var(--color-contained-fg);
                border-radius: var(--radius-lg);
                font-size: 13px;
                font-weight: 500;
                border: 0;
                font-family: inherit;
            }
            .ui-btn.outlined {
                background: transparent;
                color: var(--color-title);
                border: 1px solid var(--color-border);
            }
            .ui-btn.danger {
                background: var(--color-error);
                color: #fff;
            }
            .ui-btn.disabled,
            .ui-btn[aria-disabled='true'] {
                opacity: 0.5;
                cursor: not-allowed;
            }
            button.ui-btn {
                cursor: pointer;
                font: inherit;
            }
            button.ui-btn:focus-visible,
            .btn:focus-visible {
                outline: 2px solid var(--color-primary);
                outline-offset: 2px;
            }

            .ui-toolbar {
                display: flex;
                gap: 6px;
                justify-content: flex-end;
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid var(--color-border-light);
            }

            .ui-section-title {
                font-size: 14px;
                font-weight: 500;
                color: var(--color-title);
                margin: 0 0 12px;
            }

            .ui-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 2px 8px;
                background: var(--color-surface-200);
                color: var(--color-subtitle);
                border-radius: 999px;
                font-size: 12px;
                font-weight: 500;
            }

            .ui-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }
            .ui-table th,
            .ui-table td {
                padding: 8px 12px;
                text-align: left;
                border-bottom: 1px solid var(--color-border-light);
            }
            .ui-table th {
                background: var(--color-surface-200);
                color: var(--color-subtitle);
                font-weight: 500;
                font-size: 12px;
            }
            .ui-table td.num {
                font-variant-numeric: tabular-nums;
            }
            .ui-table tr:last-child td {
                border-bottom: 0;
            }

            .ui-select {
                position: relative;
                background: var(--color-menu-panel);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-lg);
                max-height: 200px;
                overflow-y: auto;
                font-size: 13px;
            }
            .ui-select-item {
                padding: 8px 12px;
                color: var(--color-body);
                cursor: default;
            }
            .ui-select-item:hover {
                background: var(--color-menu-hover);
            }
            .ui-select-item + .ui-select-item {
                border-top: 1px solid var(--color-border-light);
            }

            .ui-tooltip {
                position: relative;
                display: inline-flex;
            }
            .ui-tooltip-bubble {
                position: absolute;
                bottom: calc(100% + 8px);
                left: 50%;
                transform: translateX(-50%);
                background: var(--color-contained-bg);
                color: var(--color-contained-fg);
                font-size: 12px;
                padding: 6px 10px;
                border-radius: var(--radius-sm);
                white-space: nowrap;
                box-shadow: var(--shadow-md);
                pointer-events: none;
                opacity: 0;
                transition: opacity 120ms var(--ease);
            }
            .ui-tooltip:hover .ui-tooltip-bubble,
            .ui-tooltip:focus-within .ui-tooltip-bubble,
            .ui-tooltip[data-open='true'] .ui-tooltip-bubble {
                opacity: 1;
            }
            .ui-tooltip-bubble {
                z-index: 30;
            }
            .ui-tooltip-bubble::after {
                content: '';
                position: absolute;
                top: 100%;
                left: 50%;
                transform: translateX(-50%);
                border: 4px solid transparent;
                border-top-color: var(--color-contained-bg);
            }

            .mockup-locked-overlay {
                position: absolute;
                inset: 43px 1px 1px;
                border-radius: 11px;
                background: color-mix(in srgb, var(--color-background) 65%, transparent);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(8px);
                z-index: 20;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 350ms var(--ease);
                animation: fade-in 160ms var(--ease) both;
            }
            .mockup-locked-overlay-inner {
                background: var(--color-surface-100);
                border-radius: var(--radius-lg);
                box-shadow: var(--ring-surface-300), var(--shadow-md);
                padding: 10px 16px;
                font-size: 13px;
                color: var(--color-subtitle);
                pointer-events: none;
            }

            .ui-toast {
                position: absolute;
                bottom: 12px;
                right: 12px;
                background: #27272a;
                color: #fafafa;
                padding: 10px 14px;
                border-radius: var(--radius-lg);
                font-size: 13px;
                display: flex;
                align-items: center;
                gap: 8px;
                box-shadow: var(--shadow-md);
            }
            /* ==========================================================
               Sonner-style toast stack
               Per emilkowal.ski/ui/building-a-toast-component
               - Interruptible transitions on individual transform props
               - Stacked mode: translateY(lift * index) + scale(1 - 0.06 * index)
               - Height normalized to front toast so back toasts poke out evenly
               - Expand on hover via :has(), each toast at natural height
                 with offset = sum of preceding heights + gap * index
               - ::after fills the gap below each toast to keep hover continuous
               - Enter/leave via [data-mounted] and [data-removed] flip
               ========================================================== */
            .mockup-toast-list {
                position: absolute;
                top: 12px;
                left: 0;
                right: 0;
                padding: 0;
                margin: 0;
                list-style: none;
                z-index: 100;
                pointer-events: none;
            }
            .mockup-toast {
                --toast-ease: cubic-bezier(0.32, 0.72, 0, 1);
                --y-stack: 0px;
                --s-stack: 1;
                --o-stack: 1;
                --y-expand: 0px;
                --h-stack: auto;
                --h-natural: auto;
                position: absolute;
                top: 0;
                left: 50%;
                translate: -50% var(--y-stack);
                scale: var(--s-stack);
                opacity: var(--o-stack);
                height: var(--h-stack);
                transform-origin: top center;
                pointer-events: auto;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                transition:
                    translate 400ms var(--toast-ease),
                    scale 400ms var(--toast-ease),
                    opacity 400ms var(--toast-ease),
                    height 400ms var(--toast-ease);
            }
            .mockup-toast[data-mounted='false'] {
                translate: -50% -100%;
                opacity: 0;
            }
            .mockup-toast[data-removed='true'] {
                translate: -50% -100%;
                opacity: 0;
                pointer-events: none;
            }
            /* Expanded mode: any toast hovered triggers all to spread */
            .mockup-toast-list:has(.mockup-toast:hover) .mockup-toast:not([data-mounted='false']):not([data-removed='true']) {
                translate: -50% var(--y-expand);
                scale: 1;
                opacity: 1;
                height: var(--h-natural);
            }
            /* Gap-filler pseudo so hover stays continuous across expanded gaps */
            .mockup-toast::after {
                content: '';
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                height: 10px;
            }
            /* Visual pill inside the wrapper, position: static so wrapper controls layout */
            .mockup-toast-body {
                background: #27272a;
                color: #fafafa;
                padding: 10px 14px;
                border-radius: var(--radius-lg);
                font-size: 13px;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                box-shadow: var(--shadow-md);
                white-space: nowrap;
            }

            .ui-icon-btn {
                width: 28px;
                height: 28px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: transparent;
                border: 0;
                color: var(--color-subtitle);
                border-radius: var(--radius-lg);
                cursor: pointer;
                font: inherit;
            }

            .stacked-records {
                display: grid;
                gap: 6px;
            }
            .stacked-records .record {
                display: flex;
                justify-content: space-between;
                background: var(--color-surface-100);
                box-shadow: inset 0 0 0 1px var(--color-border-light);
                border-radius: var(--radius-sm);
                padding: 8px 12px;
                font-size: 13px;
            }

            /* ==========================================================
               Results
               ========================================================== */
            .result-score {
                font-family: var(--font-display);
                font-size: clamp(48px, 8vw, 72px);
                line-height: 1;
                color: var(--color-title);
                font-variant-numeric: tabular-nums;
            }
            .result-grid {
                display: grid;
                gap: 12px;
                margin: 20px 0;
            }
            .result-row {
                display: grid;
                grid-template-columns: 24px 1fr auto;
                gap: 12px;
                align-items: start;
                padding: 12px 14px;
                background: var(--color-surface-100);
                border-radius: var(--radius-lg);
                box-shadow: var(--ring-surface-300);
                font-size: 13px;
            }
            .result-row .step {
                font-size: 12px;
                color: var(--color-muted);
                font-variant-numeric: tabular-nums;
                font-weight: 500;
            }
            .result-row .topic {
                color: var(--color-title);
                font-size: 14px;
            }
            .result-row .topic .principle {
                color: var(--color-subtitle);
                font-size: 14px;
                margin-top: 2px;
            }
            .result-row .mark {
                font-size: 12px;
                font-weight: 500;
            }
            .result-row .mark.correct {
                color: var(--color-success);
            }
            .result-row .mark.incorrect {
                color: var(--color-error);
            }

            .takeaways {
                margin-top: 24px;
            }
            .takeaways h3 {
                margin-bottom: 12px;
            }
            .takeaways ul {
                list-style: none;
                padding: 0;
                margin: 0;
                display: grid;
                gap: 8px;
            }
            .takeaways li {
                display: grid;
                grid-template-columns: 16px 1fr;
                gap: 8px;
                align-items: start;
                color: var(--color-body);
                font-size: 14px;
                line-height: 1.55;
            }
            .takeaways li::before {
                content: '';
                width: 6px;
                height: 6px;
                margin-top: 8px;
                background: var(--color-primary);
                border-radius: 999px;
            }

            .results-actions {
                display: flex;
                gap: 8px;
                margin-top: 24px;
            }
        </style>
    </head>

                    wire: (root, { corrected }) => {
                        if (!corrected) {
                            const btn = root.querySelector('.ui-btn.disabled')
                            const tooltip = root.querySelector('.ui-tooltip')
                            const inputs = root.querySelectorAll('.ui-input')
                            const check = () => {
                                const allFilled = [...inputs].every(i => i.value.trim())
                                btn.classList.toggle('disabled', !allFilled)
                                btn.disabled = !allFilled
                                btn.setAttribute('aria-disabled', String(!allFilled))
                                tooltip.style.pointerEvents = allFilled ? 'none' : ''
                            }
                            inputs.forEach(i => i.addEventListener('input', check))
                            return
                        }
                        const createBtn = root.querySelector('[data-action="create"]')
                        if (createBtn)
                            createBtn.addEventListener('click', () => {
                                root.querySelectorAll('[data-required]').forEach(input => {
                                    if (input.value.trim()) return
                                    input.setAttribute('aria-invalid', 'true')
                                    if (!(input.nextElementSibling && input.nextElementSibling.classList.contains('ui-field-error'))) {
                                        const err = document.createElement('div')
                                        err.className = 'ui-field-error'
                                        err.style.cssText = 'margin-top:4px;font-size:12px;color:var(--color-error)'
                                        err.textContent = 'Required'
                                        input.after(err)
                                    }
                                })
                            })
                        root.querySelectorAll('[data-required]').forEach(input => {
                            input.addEventListener('input', () => {
                                if (!input.value.trim()) return
                                input.removeAttribute('aria-invalid')
                                if (input.nextElementSibling && input.nextElementSibling.classList.contains('ui-field-error')) input.nextElementSibling.remove()
                            })
                        })
                    },
                    prompt: 'Review this empty legal matter form. What improvement would help most?',
                    options: [
                        {
                            text: "Colour 'Create matter' red until all required fields are filled.",

                        {
                            text: "Show a toast after submit that says 'Required fields missing'.",
                            explain:

                        },
                        {
                            text: "Show 'Required' under every empty field on first load.",
                            explain:
                                'Errors on first load feel premature. Validation messages should appear after a submit attempt, or after the user has interacted with the field.',
                        },
                        {
                            text: "Keep 'Create matter' enabled and validate on submit.",
                            correct: true,
                            explain:
                                'The current disabled button hides the reason the user cannot continue, and native disabled controls are skipped by keyboard navigation. Keep the action available, then place each error next to the field that failed.',
                        },
